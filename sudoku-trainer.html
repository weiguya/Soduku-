<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ครูซูโดกุ — ฝึกเทคนิคทีละขั้น</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@500;600;700&family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAF6FF;
    --panel:#FFFFFF;
    --panel-2:#F1F9FF;
    --ink:#243B55;
    --ink-dim:#7189A6;
    --line:#DCEEFB;
    --line-thick:#8FC7EE;
    --amber:#FFA928;
    --teal:#1FC2B0;
    --purple:#8C7CFF;
    --green:#2FC26E;
    --red:#FF5A6E;
    --pink:#FF7EB6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 700px 420px at 10% -8%, rgba(255,169,40,0.16), transparent),
      radial-gradient(ellipse 600px 420px at 100% 0%, rgba(31,194,176,0.14), transparent),
      radial-gradient(ellipse 700px 500px at 50% 100%, rgba(140,124,255,0.10), transparent),
      var(--bg);
    color:var(--ink);
    font-family:'Prompt',sans-serif;
    padding:20px 14px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;}
  header{margin-bottom:16px;}
  header .eyebrow{
    font-family:'Prompt',sans-serif;
    font-size:12px;font-weight:700;
    letter-spacing:.1em;
    color:var(--pink);
    text-transform:uppercase;
  }
  h1{font-family:'Mitr',sans-serif;font-size:27px;margin:6px 0 4px;font-weight:700;color:var(--ink);}
  header p{color:var(--ink-dim);font-size:14px;margin:0;line-height:1.5;}

  .testcta{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:linear-gradient(120deg,#FF9F45,#FF6FA5);
    border-radius:18px;padding:16px 18px;margin:16px 0;cursor:pointer;
    box-shadow:0 8px 20px rgba(255,111,165,0.35);
  }
  .testcta:active{transform:scale(0.98);}
  .testcta .ttitle{font-family:'Mitr',sans-serif;color:#fff;font-weight:600;font-size:16.5px;}
  .testcta .tsub{color:rgba(255,255,255,0.9);font-size:12.5px;margin-top:2px;}
  .testcta .emoji{font-size:28px;}

  .grouprow{display:flex;gap:8px;margin:18px 0 10px;}
  .group{
    flex:1;text-align:center;padding:10px 6px;border-radius:14px;
    background:var(--panel);border:2px solid var(--line);cursor:pointer;
  }
  .group .gname{font-family:'Mitr',sans-serif;font-weight:600;font-size:13.5px;color:var(--ink);}
  .group .gcount{font-size:10.5px;color:var(--ink-dim);margin-top:2px;}
  .group.active{border-color:var(--amber);background:#FFF3E0;}
  .group.active .gname{color:#D9820A;}
  .group[data-g="mid"].active{border-color:var(--teal);background:#E3FBF8;}
  .group[data-g="mid"].active .gname{color:#0E9C8D;}
  .group[data-g="hard"].active{border-color:var(--pink);background:#FFEAF3;}
  .group[data-g="hard"].active .gname{color:#E0397E;}

  .tabs{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap;}
  .tab{
    flex:1 1 auto;background:var(--panel);border:2px solid var(--line);color:var(--ink-dim);
    padding:10px 8px;border-radius:14px;font-weight:600;font-size:13px;text-align:center;cursor:pointer;
  }
  .tab small{display:block;font-weight:400;font-size:11px;margin-top:2px;opacity:.8;}
  .tab.active{background:linear-gradient(150deg,var(--amber),#FF8A3D);color:#fff;border-color:transparent;box-shadow:0 4px 10px rgba(255,169,40,0.35);}

  .card{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 4px 16px rgba(140,180,220,0.15);}
  .explain{color:var(--ink-dim);font-size:14px;line-height:1.7;}
  .explain b{color:var(--ink);}

  .subtabs{display:flex;gap:6px;margin:14px 0;}
  .subtab{background:var(--panel-2);border:2px solid var(--line);color:var(--ink-dim);padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .subtab.active{background:var(--teal);color:#fff;border-color:transparent;}

  .level-row{display:flex;gap:6px;margin-bottom:14px;}
  .level-btn{flex:1;padding:9px 4px;border-radius:14px;border:2px solid var(--line);background:var(--panel-2);color:var(--ink-dim);font-size:12.5px;font-weight:600;cursor:pointer;text-align:center;}
  .level-btn.active{border-color:var(--amber);color:#D9820A;background:#FFF3E0;}
  .level-btn .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;}
  .level-btn[data-lv="0"] .dot{background:var(--green);}
  .level-btn[data-lv="1"] .dot{background:var(--amber);}
  .level-btn[data-lv="2"] .dot{background:var(--red);}

  .board{display:grid;grid-template-columns:repeat(9,1fr);width:100%;max-width:380px;aspect-ratio:1/1;margin:6px auto 4px;border:3px solid var(--line-thick);border-radius:12px;overflow:hidden;background:#fff;}
  .cell{display:flex;align-items:center;justify-content:center;font-family:'Prompt',sans-serif;font-weight:600;font-size:clamp(13px,4vw,19px);color:var(--ink-dim);border-right:1px solid var(--line);border-bottom:1px solid var(--line);position:relative;transition:box-shadow .35s ease;}
  .cell.thick-r{border-right:2px solid var(--line-thick);}
  .cell.thick-b{border-bottom:2px solid var(--line-thick);}
  .cell.given{color:var(--ink);font-weight:700;}
  .cell.target{color:var(--ink-dim);}
  .cell.target::after{content:"";position:absolute;inset:4px;border:2px dashed #C9DEF0;border-radius:7px;}
  .cell.target.clickable::after{border-color:var(--amber);border-style:dashed;}
  .cell.reveal{color:#D9820A;font-weight:700;animation:pop .4s ease;}
  .cell.reveal::after{display:none;}
  .cell.userval{color:var(--ink);font-weight:700;}
  .cell.userval.correct{color:var(--green);}
  .cell.userval.correct::after{border-color:var(--green);border-style:solid;}
  .cell.userval.wrong{color:var(--red);}
  .cell.userval.wrong::after{border-color:var(--red);border-style:solid;}
  @keyframes pop{0%{transform:scale(0.5);opacity:0;}70%{transform:scale(1.15);}100%{transform:scale(1);opacity:1;}}
  .shake{animation:shake .35s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}

  .pencil{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);}
  .pencil span{display:flex;align-items:center;justify-content:center;font-family:'Prompt',sans-serif;font-size:clamp(6.5px,2vw,9.5px);color:var(--ink-dim);opacity:.8;font-weight:500;}
  .pencil span.hl{color:#D9820A;font-weight:800;opacity:1;transform:scale(1.2);}
  .pencil span.gone{color:var(--red);text-decoration:line-through;opacity:.5;}

  .caption{background:var(--panel-2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.6;color:var(--ink);min-height:46px;margin:12px 0;}
  .step-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .step-controls .stepnum{font-size:12px;color:var(--ink-dim);font-weight:600;}
  button.nav{background:var(--panel-2);border:2px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:12px;font-weight:600;font-size:13px;cursor:pointer;}
  button.nav.primary{background:var(--amber);color:#fff;border-color:transparent;}
  button.nav:disabled{opacity:.35;cursor:default;}

  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-dim);margin-top:10px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .sw{width:11px;height:11px;border-radius:4px;display:inline-block;}

  .numpad{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin:14px 0 10px;}
  .numbtn{aspect-ratio:1/1;background:var(--panel-2);border:2px solid var(--line);color:var(--ink);border-radius:10px;font-family:'Prompt',sans-serif;font-weight:700;font-size:15px;cursor:pointer;}
  .numbtn.sel{background:var(--teal);color:#fff;border-color:transparent;}
  .actionrow{display:flex;gap:8px;margin-top:6px;}
  .actionrow button{flex:1;padding:11px;border-radius:14px;border:none;font-weight:700;font-size:13.5px;cursor:pointer;}
  .btn-check{background:var(--green);color:#fff;}
  .btn-hint{background:var(--panel-2);color:var(--ink);border:2px solid var(--line) !important;}
  .btn-reveal{background:var(--panel-2);color:var(--ink-dim);border:2px solid var(--line) !important;}
  .feedback{margin-top:10px;font-size:13.5px;border-radius:14px;padding:10px 12px;display:none;line-height:1.6;}
  .feedback.ok{display:block;background:#E7FBEE;color:#1D9C50;border:2px solid #BEF0CF;}
  .feedback.bad{display:block;background:#FFECEE;color:#E0384D;border:2px solid #FFC9D0;}
  .feedback.hint{display:block;background:#FFF3E0;color:#D9820A;border:2px solid #FFDFA8;}

  .testbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .backbtn{background:var(--panel-2);border:2px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:12px;font-weight:600;font-size:13px;cursor:pointer;}
  .digitpick{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin:10px 0 16px;}
  .digitpick .dbtn{aspect-ratio:1/1;background:var(--panel-2);border:2px solid var(--line);color:var(--ink);border-radius:12px;font-weight:700;font-size:16px;cursor:pointer;}
  .digitpick .dbtn.on{background:linear-gradient(150deg,var(--pink),#FF9F45);color:#fff;border-color:transparent;}
  .progresswrap{background:var(--panel-2);border-radius:999px;height:14px;overflow:hidden;margin:12px 0 6px;border:2px solid var(--line);}
  .progressfill{height:100%;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:999px;transition:width .3s ease;}
  .progresslabel{text-align:center;font-size:13px;color:var(--ink-dim);font-weight:600;margin-bottom:4px;}
  .winbanner{text-align:center;padding:18px;background:linear-gradient(135deg,#FFF3E0,#E3FBF8);border-radius:16px;margin-top:14px;}
  .winbanner .big{font-size:38px;}
  .winbanner .msg{font-family:'Mitr',sans-serif;font-weight:600;color:var(--ink);margin-top:6px;font-size:15px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Sudoku Dojo · ไม่บันทึกข้อมูล</div>
    <h1>ครูซูโดกุ 🧩</h1>
    <p>เลือกระดับ → เลือกเทคนิค → ดูสาธิตทีละขั้น แล้วลองทำโจทย์จริงตั้งแต่ง่ายถึงยาก</p>
  </header>

  <div class="testcta" onclick="openTest()">
    <div>
      <div class="ttitle">🎯 โหมดทดสอบจริง</div>
      <div class="tsub">เลือกเลข แล้วหาให้ครบทั้ง 9 ช่องในกระดานเดียว เหมือนโจทย์เพจดัง</div>
    </div>
    <div class="emoji">▶️</div>
  </div>

  <div id="normalArea">
    <div class="grouprow" id="groupRow"></div>
    <div class="tabs" id="techTabs"></div>
    <div id="techPanel"></div>
  </div>
  <div id="testArea" style="display:none;"></div>
</div>

<script>
const GROUPS = [
  {id:'basic', name:'พื้นฐาน', color:'amber'},
  {id:'mid', name:'ระดับกลาง', color:'teal'},
  {id:'hard', name:'ระดับยาก', color:'red'},
];

const TECHS = [
// ---------------- BASIC ----------------
{
  group:'basic', id:'naked', name:'Naked Single', sub:'ตัวเดียวที่เป็นไปได้',
  explain:"ดูช่องว่างช่องเดียว แล้วไล่ตัดตัวเลข 1-9 ที่ <b>ซ้ำกับแถวเดียวกัน</b>, <b>คอลัมน์เดียวกัน</b> และ <b>บล็อก 3x3 เดียวกัน</b> ออกทีละอย่าง ถ้าตัดจนเหลือตัวเลือกเดียว นั่นคือคำตอบของช่องนั้น เป็นเทคนิคพื้นฐานที่สุดและใช้บ่อยที่สุด",
  demo:{ given:{"0,4":7,"1,4":9,"3,4":6,"4,0":4,"4,3":8,"4,5":3,"4,8":1,"5,4":2,"7,4":1,"8,4":8},
    target:{r:4,c:4}, answer:5,
    steps:[
      {text:"ช่องว่างตรงกลาง (แถว 5, คอลัมน์ 5) ยังไม่รู้ว่าใส่เลขอะไรได้ ลองไล่ตัดตัวเลือกทีละขั้น", cells:[[4,4]]},
      {text:"เช็คแถว 5 ก่อน: มีเลข <b>4, 8, 3, 1</b> อยู่แล้ว ตัดเลขพวกนี้ออกจากตัวเลือก", rows:[4]},
      {text:"เช็คคอลัมน์ 5: มีเลข <b>7, 9, 6, 2, 1, 8</b> อยู่แล้ว ตัดเพิ่มเข้าไปอีก", cols:[4]},
      {text:"เช็คบล็อกกลาง (แถว 4-6, คอลัมน์ 4-6): เลขในบล็อกนี้ซ้ำกับที่ตัดไปแล้วทั้งหมด ไม่มีตัวใหม่ให้ตัดเพิ่ม", boxes:[[3,3]]},
      {text:"รวมเลขที่ตัดออกทั้งหมด (1,2,3,4,6,7,8,9) เหลือแค่ <b>5</b> ตัวเดียว! นี่คือ Naked Single", cells:[[4,4]], reveal:true},
    ]},
  practice:[
    {level:'ง่าย', given:{"2,0":1,"2,1":9,"2,2":3,"2,4":5,"2,5":6,"2,6":7,"2,7":8,"2,8":2}, target:{r:2,c:3}, answer:4, hint:"เช็คแค่แถว 3 แถวเดียวก็พอ เพราะมีเลข 1-9 อยู่ในแถวเกือบครบแล้ว"},
    {level:'ปานกลาง', given:{"4,0":1,"4,2":2,"4,3":3,"4,5":4,"4,6":5,"4,7":6,"0,1":7,"1,1":8}, target:{r:4,c:1}, answer:9, hint:"เช็คทั้งแถว 5 และคอลัมน์ 2 รวมกัน แล้วดูว่าเลขไหนยังไม่โดนตัด"},
    {level:'ยาก', given:{"1,0":1,"1,3":2,"4,7":3,"6,7":4,"0,6":5,"0,8":6,"2,6":7,"2,8":8}, target:{r:1,c:7}, answer:9, hint:"ต้องเช็คทั้งแถว 2, คอลัมน์ 8 และบล็อกขวาบนพร้อมกันถึงจะเหลือตัวเดียว"},
  ]
},
{
  group:'basic', id:'hidden', name:'Hidden Single', sub:'ตัวเดียวที่ซ่อนอยู่',
  explain:"เลือกตัวเลข 1 ตัว แล้วดูใน <b>บล็อก 3x3 หนึ่งบล็อก</b> ว่าตัวเลขนั้นมีที่ลงได้แค่ช่องเดียวหรือเปล่า ใช้เลขที่อยู่ในแถว/คอลัมน์ที่ตัดผ่านบล็อกมาช่วยตัดช่องที่เป็นไปไม่ได้ออก เทคนิคนี้ใช้บ่อยกว่า Naked Single มาก",
  demo:{ given:{"0,7":7,"1,6":7,"5,0":7,"7,2":7},
    target:{r:2,c:1}, answer:7,
    steps:[
      {text:"บล็อกซ้ายบน (แถว 1-3, คอลัมน์ 1-3) ยังไม่มีเลข 7 อยู่เลย ลองหาว่า 7 ต้องอยู่ช่องไหนในบล็อกนี้", boxes:[[0,0]]},
      {text:"เลข 7 ที่แถว 1 (นอกบล็อก) ทำให้ 3 ช่องแรกของบล็อกใส่ 7 ไม่ได้ ตัดแถว 1 ในบล็อกออก", rows:[0]},
      {text:"เลข 7 ที่แถว 2 ก็เหมือนกัน ตัดแถว 2 ในบล็อกออกอีก", rows:[1]},
      {text:"เลข 7 ที่คอลัมน์ 1 (แถวล่าง) ตัดคอลัมน์ 1 ในบล็อกออก", cols:[0]},
      {text:"เลข 7 ที่คอลัมน์ 3 (แถวล่าง) ตัดคอลัมน์ 3 ในบล็อกออกด้วย", cols:[2]},
      {text:"เหลือช่องเดียวในบล็อกที่ยังรับ 7 ได้ คือ <b>แถว 3 คอลัมน์ 2</b> นี่คือ Hidden Single!", cells:[[2,1]], reveal:true},
    ]},
  practice:[
    {level:'ง่าย', given:{"0,3":1,"0,4":2,"0,5":5,"1,4":3,"2,3":7,"2,4":4,"2,5":8,"7,5":6}, target:{r:1,c:3}, answer:6, hint:"บล็อกนี้เกือบเต็มแล้ว เหลือช่องว่างแค่ 2 ช่อง ลองดูว่าคอลัมน์ไหนตัดออกได้"},
    {level:'ปานกลาง', given:{"6,6":1,"6,8":4,"7,8":2,"8,6":5,"8,7":3,"6,2":9,"8,1":9,"2,7":9}, target:{r:7,c:6}, answer:9, hint:"บล็อกนี้มีของเดิมอยู่บ้าง เหลือช่องว่าง 4 ช่อง ต้องตัดออกทีละขั้นด้วยแถวและคอลัมน์"},
    {level:'ยาก', given:{"6,1":8,"7,8":8,"1,3":8,"0,5":8}, target:{r:8,c:4}, answer:8, hint:"บล็อกนี้ว่างเปล่าทั้งบล็อก ต้องใช้ทั้งแถวคู่และคอลัมน์คู่ช่วยตัดให้เหลือช่องเดียว"},
  ]
},
{
  group:'basic', id:'cross', name:'Cross-Hatching', sub:'สแกนไล่ทั้งกระดาน',
  explain:"เลือกตัวเลข 1 ตัวแล้ว <b>ไล่ทั้งกระดาน</b> ไม่ใช่แค่บล็อกเดียว ใช้เลขที่อยู่ในบล็อกข้างเคียงลากเส้นแถว/คอลัมน์ตัดผ่านบล็อกเป้าหมาย เพื่อตัดตัวเลือกจนเหลือช่องเดียว เป็นวิธีที่มือใหม่ใช้สแกนกระดานได้เร็วที่สุดตอนเริ่มเกม",
  demo:{ given:{"0,1":9,"2,4":9,"5,7":9,"8,6":9},
    target:{r:1,c:8}, answer:9,
    steps:[
      {text:"บล็อกขวาบน (แถว 1-3, คอลัมน์ 7-9) ยังไม่มีเลข 9 เลย เรามาไล่หาด้วยวิธี Cross-Hatching กัน", boxes:[[0,6]]},
      {text:"เลข 9 ที่แถว 1 (บล็อกซ้าย) ลากเส้นตัดแถว 1 ทั้งแถว บล็อกขวาแถว 1 ใส่ 9 ไม่ได้", rows:[0]},
      {text:"เลข 9 ที่แถว 3 (บล็อกกลาง) ลากเส้นตัดแถว 3 เหลือแถว 2 ของบล็อกที่ยังเป็นไปได้", rows:[2]},
      {text:"เลข 9 ที่คอลัมน์ 8 (แถวล่าง) ตัดคอลัมน์ 8 ออกไปอีก", cols:[7]},
      {text:"เลข 9 ที่คอลัมน์ 7 (แถวล่าง) ตัดคอลัมน์ 7 ออกไปอีก", cols:[6]},
      {text:"เหลือช่องเดียวที่ยังรับ 9 ได้ คือ <b>แถว 2 คอลัมน์ 9</b> เจอแล้ว!", cells:[[1,8]], reveal:true},

  demo:{ cands:{"0,1":[6,2],"0,4":[6,9],"3,4":[6,3],"3,7":[6,5],"8,1":[6,8],"8,7":[6,1],"5,1":[6,9]},

      {text:"แถว 4 มีตัวเลือก 6 อยู่ที่คอลัมน์ 5 กับ คอลัมน์ 8", rows:[3], highlightCand:{"3,4":[6],"3,7":[6]}},
      {text:"แถว 9 มีตัวเลือก 6 อยู่ที่คอลัมน์ 2 กับ คอลัมน์ 8", rows:[8], highlightCand:{"8,1":[6],"8,7":[6]}},

  practice:[

    {level:'ปานกลาง', cands:{"0,2":[5,1],"0,5":[5,6],"0,8":[5,9],"4,2":[5,3],"4,8":[5,7],"6,5":[5,4],"6,8":[5,2],"8,5":[5,6]}, target:{r:8,c:5}, answer:6, hint:"รอบนี้มีแถวหนึ่งที่เลข 5 โผล่ครบ 3 คอลัมน์เลย ต้องรวมกับอีก 2 แถวที่เหลือให้ครบชุด"},
    {level:'ยาก', cands:{"2,1":[3,6],"2,4":[3,8],"5,4":[3,9],"5,7":[3,5],"8,1":[3,4],"8,7":[3,1],"0,1":[3,9],"0,6":[3,2],"3,1":[3,7]}, target:{r:3,c:1}, answer:7, hint:"มีแถวหนึ่งที่ดูเหมือนจะเข้าชุดด้วย แต่คอลัมน์ที่มันโผล่ไม่ตรงกับอีก 3 แถวหลัก ถ้ารวมเข้าไปจะเกิน 3 คอลัมน์ ลองตัดแถวลวงนั้นออกแล้วดูใหม่"},

const SOLUTION = [
  [5,3,4,6,7,8,9,1,2],
  [6,7,2,1,9,5,3,4,8],
  [1,9,8,3,4,2,5,6,7],
  [8,5,9,7,6,1,4,2,3],
  [4,2,6,8,5,3,7,9,1],
  [7,1,3,9,2,4,8,5,6],
  [9,6,1,5,3,7,2,8,4],
  [2,8,7,4,1,9,6,3,5],
  [3,4,5,2,8,6,1,7,9],
];

let curGroup='basic', curTech=0, curMode='demo', curStep=0, curLevel=0, selDigit=null;
let inTest=false, testDigit=null, testFound=new Set();

function openTest(){ inTest=true; testDigit=null; testFound=new Set(); renderRoot(); }
function closeTest(){ inTest=false; renderRoot(); }
function pickTestDigit(d){ testDigit=d; testFound=new Set(); renderRoot(); }

function techsInGroup(g){ return TECHS.map((t,i)=>({...t,idx:i})).filter(t=>t.group===g); }

function groupRow(){
  const el=document.getElementById('groupRow');
  el.innerHTML = GROUPS.map(g=>{
    const n = techsInGroup(g.id).length;
    return `<div class="group ${g.id===curGroup?'active':''}" data-g="${g.id}" onclick="setGroup('${g.id}')">
      <div class="gname">${g.name}</div><div class="gcount">${n} เทคนิค</div>
    </div>`;
  }).join('');
}
function setGroup(g){
  curGroup=g;
  curTech = techsInGroup(g)[0].idx;
  curMode='demo'; curStep=0; curLevel=0; selDigit=null;
  renderRoot();
}
function techTabs(){
  const el=document.getElementById('techTabs');
  const list = techsInGroup(curGroup);
  el.innerHTML = list.map(t=>`
    <div class="tab ${t.idx===curTech?'active':''}" onclick="setTech(${t.idx})">${t.name}<small>${t.sub}</small></div>
  `).join('');
}
function setTech(i){ curTech=i; curMode='demo'; curStep=0; curLevel=0; selDigit=null; renderRoot(); }
function setMode(m){ curMode=m; curStep=0; curLevel=0; selDigit=null; renderRoot(); }
function setLevel(i){ curLevel=i; selDigit=null; renderRoot(); }

function cellShadow(r,c,hi){
  if(!hi) return '';
  const parts=[];
  if(hi.rows && hi.rows.includes(r)) parts.push('inset 0 0 0 999px rgba(255,169,40,0.30)');
  if(hi.cols && hi.cols.includes(c)) parts.push('inset 0 0 0 999px rgba(31,194,176,0.26)');
  if(hi.boxes){ for(const [br,bc] of hi.boxes){ if(r>=br&&r<br+3&&c>=bc&&c<bc+3) parts.push('inset 0 0 0 999px rgba(140,124,255,0.26)'); } }
  if(hi.cells && hi.cells.some(([rr,cc])=>rr===r&&cc===c)) parts.push('inset 0 0 0 999px rgba(255,169,40,0.38)');
  return parts.join(',');
}

function renderPencil(cands, hlSet, strikeSet){
  let html = '<div class="pencil">';
  for(let d=1; d<=9; d++){
    if(cands.includes(d)){
      let cls='';
      if(strikeSet && strikeSet.includes(d)) cls='gone';
      else if(hlSet && hlSet.includes(d)) cls='hl';
      html += `<span class="${cls}">${d}</span>`;
    } else { html += '<span></span>'; }
  }
  html += '</div>';
  return html;
}

function buildBoard(opts){
  let html = '<div class="board">';
  for(let r=0;r<9;r++){
    for(let c=0;c<9;c++){
      const key = r+','+c;
      const isTarget = opts.target && opts.target.r===r && opts.target.c===c;
      let classes=['cell'];
      if(c%3===2 && c!==8) classes.push('thick-r');
      if(r%3===2 && r!==8) classes.push('thick-b');
      let content='';
      if(isTarget){
        classes.push('target');
        if(opts.reveal){ classes.push('reveal'); content = opts.answer; }
        else if(opts.userState && opts.userState.digit){
          classes.push('userval');
          if(opts.userState.status==='correct') classes.push('correct');
          if(opts.userState.status==='wrong') classes.push('wrong');
          content = opts.userState.digit;
        } else if(opts.interactive){ classes.push('clickable'); content='?'; }
        else { content='?'; }
      } else if(opts.given && opts.given[key]!==undefined){
        classes.push('given'); content = opts.given[key];
      } else if(opts.cands && opts.cands[key]!==undefined){
        const hl = opts.hlCand ? opts.hlCand[key] : null;
        const st = opts.strikeCand ? opts.strikeCand[key] : null;
        content = renderPencil(opts.cands[key], hl, st);
      }
      const shadow = cellShadow(r,c,opts.hi);
      html += `<div class="${classes.join(' ')}" id="cell-${r}-${c}" style="box-shadow:${shadow}">${content}</div>`;
    }
  }
  html += '</div>';
  return html;
}

function legendHTML(){
  return `<div class="legend">
    <span><span class="sw" style="background:rgba(255,169,40,0.7)"></span>แถว</span>
    <span><span class="sw" style="background:rgba(31,194,176,0.7)"></span>คอลัมน์</span>
    <span><span class="sw" style="background:rgba(140,124,255,0.7)"></span>บล็อก 3x3</span>
  </div>`;
}

function renderDemo(t){
  const step = t.demo.steps[curStep];
  const hi = {rows:step.rows, cols:step.cols, boxes:step.boxes, cells:step.cells};
  let strikeCand = {};
  for(let i=0;i<=curStep;i++){
    const s = t.demo.steps[i].strikeCand;
    if(s){ for(const k in s){ strikeCand[k] = (strikeCand[k]||[]).concat(s[k]); } }
  }
  const boardHTML = buildBoard({
    given:t.demo.given||{}, cands:t.demo.cands||{}, target:t.demo.target, reveal:!!step.reveal, answer:t.demo.answer,
    hi, hlCand:step.highlightCand, strikeCand, interactive:false
  });
  return `
    ${boardHTML}
    ${legendHTML()}
    <div class="caption">${step.text}</div>
    <div class="step-controls">
      <button class="nav" onclick="stepDemo(-1)" ${curStep===0?'disabled':''}>← ย้อนกลับ</button>
      <span class="stepnum">ขั้น ${curStep+1} / ${t.demo.steps.length}</span>
      <button class="nav primary" onclick="stepDemo(1)" ${curStep===t.demo.steps.length-1?'disabled':''}>ถัดไป →</button>
    </div>
  `;
}
function stepDemo(d){
  const t=TECHS[curTech];
  curStep = Math.max(0, Math.min(t.demo.steps.length-1, curStep+d));
  renderRoot();
}

let practiceState = {};

function renderPractice(t){
  const p = t.practice[curLevel];
  const stKey = t.id+'-'+curLevel;
  const st = practiceState[stKey] || {digit:null,status:null};
  const boardHTML = buildBoard({given:p.given||{}, cands:p.cands||{}, target:p.target, interactive:!st.status, userState:st});
  const levels=['ง่าย','ปานกลาง','ยาก'];
  const levelRow = levels.map((lv,i)=>`<div class="level-btn ${i===curLevel?'active':''}" data-lv="${i}" onclick="setLevel(${i})"><span class="dot"></span>${lv}</div>`).join('');
  const numpad = Array.from({length:9},(_,i)=>i+1).map(n=>`<div class="numbtn ${selDigit===n?'sel':''}" onclick="pickDigit(${n})">${n}</div>`).join('');

  let feedback='';
  if(st.status==='correct'){
    feedback = `<div class="feedback ok">ถูกต้อง! ช่อง แถว ${p.target.r+1} คอลัมน์ ${p.target.c+1} ต้องเป็นเลข ${p.answer} — ${p.hint}</div>`;
  } else if(st.status==='wrong'){
    feedback = `<div class="feedback bad">ยังไม่ใช่ครับ ลองไล่เช็คแถว/คอลัมน์/บล็อกของช่องนี้อีกครั้ง</div>`;
  } else if(st.showHint){
    feedback = `<div class="feedback hint">💡 ${p.hint}</div>`;
  }

  return `
    <div class="level-row">${levelRow}</div>
    ${boardHTML}
    ${legendHTML()}
    <div class="caption">หาว่าช่องที่มีกรอบประ (แถว ${p.target.r+1}, คอลัมน์ ${p.target.c+1}) ควรใส่เลขอะไร แล้วกดเลขด้านล่าง</div>
    <div class="numpad">${numpad}</div>
    <div class="actionrow">
      <button class="btn-hint" onclick="showHint()">คำใบ้</button>
      <button class="btn-check" onclick="checkAnswer()">ตรวจคำตอบ</button>
      <button class="btn-reveal" onclick="revealAnswer()">เฉลย</button>
    </div>
    ${feedback}
  `;
}
function pickDigit(n){
  const t=TECHS[curTech]; const stKey=t.id+'-'+curLevel;
  if(practiceState[stKey] && practiceState[stKey].status==='correct') return;
  selDigit = n; renderRoot();
}
function checkAnswer(){
  if(selDigit===null) return;
  const t=TECHS[curTech]; const p=t.practice[curLevel]; const stKey=t.id+'-'+curLevel;
  const correct = selDigit===p.answer;
  practiceState[stKey] = {digit:selDigit, status: correct?'correct':'wrong', showHint:false};
  renderRoot();
  if(!correct){
    setTimeout(()=>{
      const cellEl = document.getElementById(`cell-${p.target.r}-${p.target.c}`);
      if(cellEl) cellEl.classList.add('shake');
    }, 30);
  }
}
function revealAnswer(){
  const t=TECHS[curTech]; const p=t.practice[curLevel]; const stKey=t.id+'-'+curLevel;
  selDigit = p.answer;
  practiceState[stKey] = {digit:p.answer, status:'correct', showHint:false};
  renderRoot();
}
function showHint(){
  const t=TECHS[curTech]; const stKey=t.id+'-'+curLevel;
  const st = practiceState[stKey] || {};
  practiceState[stKey] = {...st, showHint:true};
  renderRoot();
}

// ---------- REAL TEST MODE ----------
function testCellClick(r,c){
  if(testDigit===null) return;
  if(testFound.has(r+','+c)) return;
  if(SOLUTION[r][c]===testDigit){
    testFound.add(r+','+c);
    renderRoot();
  } else {
    const el = document.getElementById(`tcell-${r}-${c}`);
    if(el){ el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'), 350); }
  }
}
function renderTest(){
  const el = document.getElementById('testArea');
  const digitPickHTML = Array.from({length:9},(_,i)=>i+1).map(n=>
    `<div class="dbtn ${testDigit===n?'on':''}" onclick="pickTestDigit(${n})">${n}</div>`
  ).join('');

  if(testDigit===null){
    el.innerHTML = `
      <div class="testbar"><button class="backbtn" onclick="closeTest()">← กลับ</button></div>
      <div class="card">
        <div class="explain"><b>โหมดทดสอบจริง</b> — เลือกเลข 1 ตัวที่อยากเทส แล้วหาให้ครบว่าเลขนั้นควรอยู่ช่องไหนบ้างในกระดาน (ทั้งหมด 9 ช่อง) เหมือนโจทย์เพจดังที่ส่งมา ไม่มีตัวเลือกให้กดผิด ใช้หลักการแถว/คอลัมน์/บล็อกล้วนๆ</div>
        <div class="digitpick">${digitPickHTML}</div>
      </div>`;
    return;
  }

  let html = '<div class="board">';
  for(let r=0;r<9;r++){
    for(let c=0;c<9;c++){
      const val = SOLUTION[r][c];
      const key = r+','+c;
      let classes=['cell'];
      if(c%3===2 && c!==8) classes.push('thick-r');
      if(r%3===2 && r!==8) classes.push('thick-b');
      let content='';
      if(val===testDigit){
        if(testFound.has(key)){
          classes.push('userval','correct');
          content = val;
        } else {
          classes.push('target','clickable');
          content = '';
        }
      } else {
        classes.push('given');
        content = val;
      }
      html += `<div class="${classes.join(' ')}" id="tcell-${r}-${c}" onclick="testCellClick(${r},${c})" style="cursor:${val===testDigit && !testFound.has(key) ? 'pointer':'default'}">${content}</div>`;
    }
  }
  html += '</div>';

  const pct = Math.round(testFound.size/9*100);
  const done = testFound.size===9;

  el.innerHTML = `
    <div class="testbar">
      <button class="backbtn" onclick="closeTest()">← กลับ</button>
      <button class="backbtn" onclick="pickTestDigit(null)">🔄 เปลี่ยนเลข</button>
    </div>
    <div class="card">
      <div class="explain">หาช่องทั้งหมดที่ควรใส่เลข <b>${testDigit}</b> ในกระดานนี้ แตะช่องว่างที่คิดว่าใช่ได้เลย</div>
      ${html}
      <div class="progresslabel">เจอแล้ว ${testFound.size} / 9</div>
      <div class="progresswrap"><div class="progressfill" style="width:${pct}%"></div></div>
      ${done ? `<div class="winbanner"><div class="big">🎉🧩🎉</div><div class="msg">เก่งมาก! หาเลข ${testDigit} ครบทั้ง 9 ช่องแล้ว</div></div>` : ''}
    </div>
  `;
}

function renderRoot(){
  document.getElementById('normalArea').style.display = inTest ? 'none' : 'block';
  document.getElementById('testArea').style.display = inTest ? 'block' : 'none';
  if(inTest){ renderTest(); return; }

  groupRow();
  techTabs();
  const t = TECHS[curTech];
  const panel = document.getElementById('techPanel');
  panel.innerHTML = `
    <div class="card">
      <div class="explain">${t.explain}</div>
      <div class="subtabs">
        <div class="subtab ${curMode==='demo'?'active':''}" onclick="setMode('demo')">▶ ดูสาธิต</div>
        <div class="subtab ${curMode==='practice'?'active':''}" onclick="setMode('practice')">✎ แบบฝึกหัด</div>
      </div>
      ${curMode==='demo' ? renderDemo(t) : renderPractice(t)}
    </div>
  `;
}
renderRoot();
</script>
