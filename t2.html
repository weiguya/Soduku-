<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ย้ายข้อมูลขึ้น muifei</title>
<style>
  :root{ --ink:#14171F; --sub:#6B7280; --line:#E5E7EB; --ok:#0E8A5F; --bad:#C0392B; --bg:#F7F7F8; }
  *{box-sizing:border-box}
  body{margin:0;padding:18px 14px 60px;background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
       font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
  h1{font-size:17px;font-weight:700;margin:0 0 2px}
  .sub{font-size:12.5px;color:var(--sub);margin:0 0 18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  label{display:block;font-size:12.5px;color:var(--sub);margin:0 0 5px}
  input[type=email],input[type=password]{width:100%;height:44px;padding:0 12px;font-size:15px;
        border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
        margin-bottom:12px;font-family:inherit}
  input[type=file]{width:100%;font-size:13.5px;margin-bottom:12px}
  input:focus{outline:2px solid var(--ink);outline-offset:-2px}
  button{width:100%;height:46px;border:0;border-radius:10px;background:var(--ink);color:#fff;
         font-size:15px;font-weight:600;font-family:inherit}
  button:disabled{opacity:.45}
  .peek{font-size:13px;color:var(--sub);margin:-4px 0 12px;white-space:pre-line}
  .row{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .row:last-child{border-bottom:0}
  .mk{flex:0 0 20px;font-size:15px;line-height:1.4}
  .tx{flex:1;min-width:0}
  .nm{font-size:14px}
  .er{font-size:12px;color:var(--bad);word-break:break-word;margin-top:3px;
      font-family:ui-monospace,Menlo,Consolas,monospace}
  .no{font-size:12px;color:var(--sub);margin-top:3px;word-break:break-word}
  .ok .mk{color:var(--ok)} .bad .mk{color:var(--bad)} .run .mk{color:var(--sub)}
  .verdict{margin-top:14px;padding:12px;border-radius:10px;font-size:14px;font-weight:600;text-align:center}
  .verdict.pass{background:#E6F5EF;color:var(--ok)}
  .verdict.fail{background:#FBEAE7;color:var(--bad)}
</style>
</head>
<body>

<h1>ย้ายข้อมูลขึ้น muifei</h1>
<p class="sub">อัปได้ซ้ำโดยไม่เกิดของซ้ำ รายการเดิมจะถูกทับด้วยตัวเดียวกัน</p>

<div class="card">
  <label for="fl">ไฟล์สำรอง .json</label>
  <input id="fl" type="file" accept=".json,application/json">
  <div class="peek" id="peek"></div>
  <label for="em">อีเมล</label>
  <input id="em" type="email" autocomplete="username" inputmode="email">
  <label for="pw">รหัสผ่าน</label>
  <input id="pw" type="password" autocomplete="current-password">
  <button id="go" disabled>อัปโหลดขึ้นเซิร์ฟเวอร์</button>
</div>

<div class="card" id="out" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var URL_='https://yffuzlmmddyaqenkujwk.supabase.co';
var KEY_='sb_publishable_R2HAmFvoFoQd5NKZjLwzvQ_PLoSETVL';

var out=document.getElementById('out'), peek=document.getElementById('peek'),
    btn=document.getElementById('go'), rows=[], DATA=null, VERD='';

function draw(){
  out.hidden=false;
  out.innerHTML=rows.map(function(r){
    return '<div class="row '+r.s+'"><div class="mk">'+
      (r.s==='ok'?'✓':r.s==='bad'?'✕':'•')+'</div><div class="tx"><div class="nm">'+r.n+'</div>'+
      (r.e?'<div class="er">'+r.e+'</div>':'')+
      (r.d?'<div class="no">'+r.d+'</div>':'')+'</div></div>';
  }).join('')+VERD;
}
function step(n){ rows.push({n:n,s:'run'}); draw(); return rows[rows.length-1]; }
function ok(r,d){ r.s='ok'; r.d=d||''; draw(); }
function bad(r,e){ r.s='bad'; r.e=e; draw(); }
function fin(pass,msg){
  VERD='<div class="verdict '+(pass?'pass':'fail')+'">'+msg+'</div>';
  draw(); btn.disabled=false;
}

document.getElementById('fl').onchange=function(){
  var f=this.files[0]; if(!f) return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result);
      if(!d || !Array.isArray(d.entries)) throw new Error('ไม่ใช่ไฟล์สำรองของมุ่ยเฟย');
      DATA=d; btn.disabled=false;
      var cn=(d.cats&&d.cats.out?d.cats.out.length:0)+(d.cats&&d.cats['in']?d.cats['in'].length:0);
      peek.textContent='อ่านไฟล์ได้แล้ว\nรายการ '+d.entries.length+' แถว · หมวด '+cn+
                       ' · ยอดตั้งต้น '+(d.opening||0).toLocaleString()+' บาท';
      peek.style.color='#0E8A5F';
    }catch(e){
      DATA=null; btn.disabled=true;
      peek.textContent='เปิดไฟล์ไม่ได้: '+e.message; peek.style.color='#C0392B';
    }
  };
  fr.readAsText(f);
};

btn.onclick=async function(){
  btn.disabled=true; rows=[]; VERD=''; draw();
  var sb,uid;

  var r=step('เข้าสู่ระบบ');
  try{
    if(!window.supabase) throw new Error('โหลดไลบรารีไม่ได้');
    sb=window.supabase.createClient(URL_,KEY_);
  }catch(e){ bad(r,e.message); return fin(false,'ติดตั้งแต่ต้น'); }
  var a=await sb.auth.signInWithPassword({
    email:document.getElementById('em').value.trim(),
    password:document.getElementById('pw').value});
  if(a.error){ bad(r,a.error.message); return fin(false,'ยังไม่ได้อัปอะไรขึ้นไป'); }
  uid=a.data.user.id; ok(r);

  r=step('ตรวจรูปแบบรายการ');
  var good=[],skip=0,seen={};
  DATA.entries.forEach(function(e){
    var id=e.id, amt=Number(e.amount);
    if(!id||seen[id]||!e.date||!/^\d{4}-\d{2}-\d{2}$/.test(e.date)||!isFinite(amt)
       ||(e.type!=='in'&&e.type!=='out')){ skip++; return; }
    seen[id]=1;
    good.push({id:String(id),name:String(e.name||''),amount:amt,
               type:e.type,cat:e.cat?String(e.cat):null,date:e.date});
  });
  if(!good.length){ bad(r,'ไม่มีแถวที่ใช้ได้เลย'); return fin(false,'หยุดไว้ก่อน'); }
  ok(r,'ส่งได้ '+good.length+' แถว'+(skip?' · ข้าม '+skip+' แถวที่ข้อมูลไม่ครบ':''));

  r=step('ส่งรายการขึ้นเซิร์ฟเวอร์');
  for(var i=0;i<good.length;i+=400){
    var part=good.slice(i,i+400);
    var up=await sb.from('entries').upsert(part,{onConflict:'id'});
    if(up.error){ bad(r,up.error.message); return fin(false,'ส่งไปได้ '+i+' แถวแล้วติด'); }
    r.d='ส่งแล้ว '+Math.min(i+400,good.length)+'/'+good.length; draw();
  }
  ok(r,'ส่งครบ '+good.length+' แถว');

  r=step('ส่งการตั้งค่า');
  var st={}; for(var k in DATA) if(k!=='entries') st[k]=DATA[k];
  var us=await sb.from('settings').upsert({user_id:uid,data:st,updated_at:new Date().toISOString()});
  if(us.error){ bad(r,us.error.message); return fin(false,'รายการขึ้นแล้ว แต่การตั้งค่ายังไม่ขึ้น'); }
  ok(r,'ยอดตั้งต้น หมวด ชิป ธีม ครบ');

  r=step('นับของบนเซิร์ฟเวอร์');
  var c=await sb.from('entries').select('id',{count:'exact',head:true});
  if(c.error){ bad(r,c.error.message); return fin(false,'อัปแล้วแต่อ่านกลับไม่ได้'); }
  ok(r,'มีทั้งหมด '+c.count+' แถว');
  fin(c.count===good.length,
      c.count===good.length?'ตรงกับในเครื่อง ข้อมูลขึ้นครบแล้ว'
                           :'เลขไม่ตรง ('+c.count+' บนเซิร์ฟเวอร์ / '+good.length+' ที่ส่ง) ส่งภาพมาให้ดู');
};
</script>
</body>
</html>
