<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>เช็คการเชื่อมต่อ muifei</title>
<style>
  :root{ --ink:#14171F; --sub:#6B7280; --line:#E5E7EB; --ok:#0E8A5F; --bad:#C0392B; --bg:#F7F7F8; }
  *{box-sizing:border-box}
  body{margin:0;padding:18px 14px 60px;background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
       font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
  h1{font-size:17px;font-weight:700;margin:0 0 2px}
  .sub{font-size:12.5px;color:var(--sub);margin:0 0 18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  label{display:block;font-size:12.5px;color:var(--sub);margin:0 0 5px}
  input{width:100%;height:44px;padding:0 12px;font-size:15px;border:1px solid var(--line);
        border-radius:10px;background:#fff;color:var(--ink);margin-bottom:12px;font-family:inherit}
  input:focus{outline:2px solid var(--ink);outline-offset:-2px}
  button{width:100%;height:46px;border:0;border-radius:10px;background:var(--ink);color:#fff;
         font-size:15px;font-weight:600;font-family:inherit}
  button:disabled{opacity:.45}
  .row{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .row:last-child{border-bottom:0}
  .mk{flex:0 0 20px;font-size:15px;line-height:1.4}
  .tx{flex:1;min-width:0}
  .nm{font-size:14px}
  .er{font-size:12px;color:var(--bad);word-break:break-word;margin-top:3px;
      font-family:ui-monospace,Menlo,Consolas,monospace}
  .no{font-size:12px;color:var(--sub);margin-top:3px;word-break:break-word}
  .ok .mk{color:var(--ok)} .bad .mk{color:var(--bad)} .run .mk{color:var(--sub)}
  .verdict{margin-top:14px;padding:12px;border-radius:10px;font-size:14px;font-weight:600;text-align:center}
  .verdict.pass{background:#E6F5EF;color:var(--ok)}
  .verdict.fail{background:#FBEAE7;color:var(--bad)}
</style>
</head>
<body>

<h1>เช็คการเชื่อมต่อ muifei</h1>
<p class="sub">หน้านี้ไม่แตะข้อมูลจริง แถวที่เขียนจะถูกลบทิ้งทันที</p>

<div class="card">
  <label for="em">อีเมล</label>
  <input id="em" type="email" autocomplete="username" inputmode="email">
  <label for="pw">รหัสผ่าน</label>
  <input id="pw" type="password" autocomplete="current-password">
  <button id="go">เริ่มเช็ค</button>
</div>

<div class="card" id="out" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var URL_='https://yffuzlmmddyaqenkujwk.supabase.co';
var KEY_='sb_publishable_R2HAmFvoFoQd5NKZjLwzvQ_PLoSETVL';

var out=document.getElementById('out'), rows=[];

function draw(){
  out.hidden=false;
  out.innerHTML=rows.map(function(r){
    return '<div class="row '+r.s+'"><div class="mk">'+
      (r.s==='ok'?'✓':r.s==='bad'?'✕':'•')+'</div><div class="tx"><div class="nm">'+r.n+'</div>'+
      (r.e?'<div class="er">'+r.e+'</div>':'')+
      (r.d?'<div class="no">'+r.d+'</div>':'')+'</div></div>';
  }).join('') + (window._verdict||'');
}
function step(n){ rows.push({n:n,s:'run'}); draw(); return rows[rows.length-1]; }
function ok(r,d){ r.s='ok'; r.d=d||''; draw(); }
function bad(r,e){ r.s='bad'; r.e=e; draw(); }

document.getElementById('go').onclick=async function(){
  var btn=this; btn.disabled=true; rows=[]; window._verdict=''; draw();
  var sb, uid, testId='test_'+Date.now().toString(36);

  var r=step('ต่อกับเซิร์ฟเวอร์');
  try{
    if(!window.supabase) throw new Error('โหลดไลบรารีไม่ได้ (เน็ตหรือ CDN)');
    sb=window.supabase.createClient(URL_,KEY_);
    ok(r);
  }catch(e){ bad(r,e.message); return fin(btn,false); }

  r=step('เข้าสู่ระบบ');
  var a=await sb.auth.signInWithPassword({
    email:document.getElementById('em').value.trim(),
    password:document.getElementById('pw').value
  });
  if(a.error){ bad(r,a.error.message); return fin(btn,false); }
  uid=a.data.user.id; ok(r,'uid '+uid.slice(0,8)+'…');

  r=step('อ่านตาราง entries');
  var s=await sb.from('entries').select('id');
  if(s.error){ bad(r,s.error.message); return fin(btn,false); }
  ok(r,'เจอ '+s.data.length+' แถว');

  r=step('เขียนแถวทดสอบ');
  var i=await sb.from('entries').insert({
    id:testId, name:'ทดสอบ', amount:1, type:'out', cat:'อื่นๆ', date:'2026-08-17'
  }).select();
  if(i.error){ bad(r,i.error.message); return fin(btn,false); }
  ok(r,'user_id ถูกเติมให้เอง: '+(i.data[0].user_id===uid?'ใช่':'ไม่ใช่ ⚠'));

  r=step('เขียน settings');
  var u=await sb.from('settings').upsert({user_id:uid,data:{ping:1}}).select();
  if(u.error){ bad(r,u.error.message); return fin(btn,false); }
  ok(r);

  r=step('ลบแถวทดสอบ');
  var d=await sb.from('entries').delete().eq('id',testId);
  if(d.error){ bad(r,d.error.message); return fin(btn,false); }
  var c=await sb.from('entries').select('id').eq('id',testId);
  if(c.data && c.data.length){ bad(r,'ลบแล้วแต่ยังอยู่'); return fin(btn,false); }
  ok(r);

  await sb.from('settings').delete().eq('user_id',uid);
  fin(btn,true);
};

function fin(btn,pass){
  window._verdict='<div class="verdict '+(pass?'pass':'fail')+'">'+
    (pass?'ผ่านหมด พร้อมย้ายข้อมูลจริง':'ติดตรงข้อที่ขึ้น ✕ ก๊อปข้อความแดงส่งมา')+'</div>';
  draw(); btn.disabled=false;
}
</script>
</body>
</html>
